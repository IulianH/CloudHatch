services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cloudhatch
      - POSTGRES_PASSWORD=cloudhatch
      - POSTGRES_DB=nodeauth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - default

  auth.web:
    image: ${DOCKER_REGISTRY-}nodeauth
    build:
      context: ./NodeAuth
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=cloudhatch
      - POSTGRES_PASSWORD=cloudhatch
      - POSTGRES_DATABASE=nodeauth
      - POSTGRES_USE_SSL=false
      - JWT_KEY=dev-only-jwt-secret
      - ORIGIN_SCHEME=https
      - ORIGIN_HOST=localhost
      - AUTH_COOKIE_SECRET_BASE64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --inspect=0.0.0.0:9229
      - -r
      - ts-node/register
      - src/index.ts
    ports:
      - "8080"
      - "9229:9229"    # Node.js debugger port
    networks:
      - default

  backapi.web:
    image: ${DOCKER_REGISTRY-}nodebackapi
    build:
      context: ./NodeBackApi
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=cloudhatch
      - POSTGRES_PASSWORD=cloudhatch
      - POSTGRES_DATABASE=nodeauth
      - POSTGRES_USE_SSL=false
      - JWT_KEY=dev-only-jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --inspect=0.0.0.0:9230
      - -r
      - ts-node/register
      - src/index.ts
    ports:
      - "8080"
      - "9230:9230"    # Node.js debugger port
    networks:
      - default                      

  # Next.js development service with hot reload and debugging
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"    # Next.js dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    networks:
      - default        # Allow direct access for debugging

  reverse-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    networks:
      - default                  # egress to Internet (OCSP/ACME/etc.)    # reach the private app
      - private
    depends_on:
      - auth.web
      - backapi.web
      - frontend

networks:
  private:
    internal: true

volumes:
  postgres_data:

